# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more

$mod = SUPER # Sets "Windows" key as main modifier

# Hyprland control
bind = $mod, BACKSPACE, exit,
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen,
bind = $mod, C, togglefloating,

# System
bind = $mod, L, exec, pidof hyprlock || hyprlock --immediate
bind = $mod, P, exec, $HOME/.config/hypr/scripts/power.sh
bind = $mod, SPACE, exec, $menu
bind = $mod SHIFT, V, exec, cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy
bind = $mod, O, exec, killall -SIGUSR2 waybar

bind = $mod, Print, exec, $HOME/.config/hypr/scripts/screen_capture.sh toggle
bind = $mod SHIFT, Print, exec, $HOME/.config/hypr/scripts/screen_capture.sh toggle --audio

# Wallpaper control
bind = $mod SHIFT, B, exec, $HOME/.config/hypr/scripts/wallpaper_control.sh change

# Move focus with mod + arrow keys
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Scroll through existing workspaces with mod + scroll
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Switch workspaces with mod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

bind = $mod, BACKSLASH, togglespecialworkspace, terminal
bind = $mod SHIFT, BACKSLASH, movetoworkspace, special:terminal

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, $HOME/.config/hypr/scripts/volume.sh --inc
bindel = ,XF86AudioLowerVolume, exec, $HOME/.config/hypr/scripts/volume.sh --dec
bindel = ,XF86AudioMute, exec, $HOME/.config/hypr/scripts/volume.sh --toggle
bindel = ,XF86AudioMicMute, exec, $HOME/.config/hypr/scripts/volume.sh --toggle-mic
bindel = ,XF86MonBrightnessUp, exec, $HOME/.config/hypr/scripts/brightness.sh up
bindel = ,XF86MonBrightnessDown, exec, $HOME/.config/hypr/scripts/brightness.sh down

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bind = , Print, exec, hyprshot -m region

# Launch applications
bind = $mod, RETURN, exec, $terminal
bind = $mod, W, exec, $browser
bind = $mod, E, exec, $fileManager


bind = $mod, B, exec, pkill waybar || waybar

# Layout specific
# bind = $mod, P, pseudo, # dwindle
# bind = $mod, J, togglesplit, # dwindle
