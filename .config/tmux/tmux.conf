# enable mouse
set -g mouse on

# plugins
set -g @plugin 'tmux-plugins/tpm'				# plugin manager
set -g @plugin 'tmux-plugins/tmux-resurrect'	# easy way to save/restore sesions
set -g @plugin 'egel/tmux-gruvbox'				# theme

# set theme variant
set -g @tmux-gruvbox 'dark-transparent'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

set -g default-shell /usr/sbin/fish

bind-key space display-popup -d '#{pane_current_path}' -w 80% -h 80% 'gemini'
bind-key e display-popup -d '#{pane_current_path}' -w 80% -h 80% 'yazi'
bind-key g display-popup -d '#{pane_current_path}' -w 80% -h 80% 'lazygit'

# plugin hook
run '~/.config/tmux/plugins/tpm/tpm'
